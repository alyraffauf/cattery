name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: build-linux
    runs-on: ubuntu-22.04
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # cachix/install-nix-action v31.11.0
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
      - run: nix develop -c bash -euo pipefail -c 'CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o /tmp/cattery-linux-amd64 ./cmd/cattery'

  build-darwin:
    name: build-darwin-arm64
    runs-on: ubuntu-22.04
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # cachix/install-nix-action v31.11.0
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
      - run: nix develop -c bash -euo pipefail -c 'CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o /tmp/cattery-darwin-arm64 ./cmd/cattery'

  test-linux:
    name: test-linux
    runs-on: ubuntu-22.04
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-go v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
          cache: true
      - run: go test ./...
