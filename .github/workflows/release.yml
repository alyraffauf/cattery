name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate the read-only release path without publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: build-and-smoke
    runs-on: ubuntu-22.04
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # cachix/install-nix-action v31.11.0
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
      - name: Validate release tooling
        if: github.event_name == 'workflow_dispatch'
        run: nix develop -c bash -euo pipefail -c 'shellcheck scripts/package-release.sh scripts/smoke-release.sh scripts/tests/package_release_test.sh scripts/tests/smoke_release_test.sh && bash scripts/tests/package_release_test.sh && bash scripts/tests/smoke_release_test.sh && nix flake check --no-build'
      - name: Package and smoke tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: nix develop -c bash -euo pipefail -c 'scripts/package-release.sh && scripts/smoke-release.sh'

  publish:
    name: publish
    needs: build-and-smoke
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # cachix/install-nix-action v31.11.0
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
      - name: Rebuild and smoke the exact tag
        run: nix develop -c bash -euo pipefail -c 'scripts/package-release.sh && scripts/smoke-release.sh'
      - name: Publish local assets
        run: nix develop -c gh release create --verify-tag "$GITHUB_REF_NAME" dist/cattery_*.tar.gz dist/SHA256SUMS --title "$GITHUB_REF_NAME" --generate-notes
